<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kongensgade Screen 1 - Test</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>
  <video id="reel" src="reel.mp4" autoplay muted loop playsinline></video>
  <script>
    // Basic resilience for an unattended kiosk screen:
    // if the video ever pauses or stalls, try to resume it automatically.
    var video = document.getElementById('reel');

    video.addEventListener('pause', function () {
      video.play().catch(function () {});
    });

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) {
        video.play().catch(function () {});
      }
    });

    // If the video errors out entirely, try reloading the whole page
    // after a short delay rather than leaving the screen stuck/black.
    video.addEventListener('error', function () {
      setTimeout(function () { location.reload(); }, 10000);
    });
  </script>
</body>
</html>
